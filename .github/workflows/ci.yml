name: Playwright + pytest CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # 支持手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # 冒烟用例作为快速信号：失败也能在几十秒内发现，但不阻断全量执行
      - name: Run smoke tests (fast signal)
        run: pytest -m smoke --html=reports/smoke.html --self-contained-html

      # 全量执行：不再按 marker 筛子集，确保 28 条用例（含纯 api 标记的 14 条）都进 CI
      # if: always() 保证 smoke 失败时仍跑全量，避免只看到第一段结果
      - name: Run full test suite
        if: always()
        run: pytest --html=reports/report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/
          retention-days: 7
