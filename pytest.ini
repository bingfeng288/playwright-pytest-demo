[pytest]
# ---------- 测试发现 ----------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------- 默认运行参数 ----------
# --html 生成自包含 HTML 报告；--maxfail 快速失败；-ra 汇总非通过原因
addopts =
    -v
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --tb=short

# ---------- 自定义标记（配合 -m 使用）----------
markers =
    ui: 前端 UI 自动化测试（Playwright 浏览器）
    api: 接口测试（requests）
    smoke: 冒烟测试，核心主流程，CI 每次必跑
    regression: 回归测试，全量用例
    data_driven: 数据驱动/参数化用例

# ---------- 日志 ----------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
